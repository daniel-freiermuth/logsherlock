name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch, or tag to release
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu22
            name: Ubuntu 22.04 x86_64
            os: ubuntu-22.04
            arch: amd64
            platform: ubuntu22
            deb: true
          - id: ubuntu24
            name: Ubuntu 24.04 x86_64
            os: ubuntu-24.04
            arch: amd64
            platform: ubuntu24
            deb: true
          - id: macos-x86_64
            name: macOS x86_64
            os: macos-15-intel
            arch: x86_64
            platform: macos
            deb: false
          - id: macos-aarch64
            name: macOS aarch64
            os: macos-14
            arch: aarch64
            platform: macos
            deb: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - id: version
        name: Detect package version change
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          current="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "logcrab").version')"
          echo "tag=v${current}" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$(git show "$BEFORE:Cargo.toml" 2>/dev/null | awk -F'"' '/^version = / { print $2; exit }')"
          echo "release=$([[ "$current" != "$previous" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false

      - if: steps.version.outputs.release == 'true'
        name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.version.outputs.release == 'true' && runner.os == 'Linux'
        name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes dpkg-dev

      - if: steps.version.outputs.release == 'true' && matrix.deb
        name: Install cargo-deb
        run: |
          cargo install cargo-deb --version 3.6.3 --locked --root "$RUNNER_TEMP/cargo-deb"
          echo "$RUNNER_TEMP/cargo-deb/bin" >> "$GITHUB_PATH"

      - if: steps.version.outputs.release == 'true'
        name: Build release binary
        run: cargo build --release --locked --bin logcrab

      - if: steps.version.outputs.release == 'true' && matrix.deb
        name: Build Debian package
        run: cargo deb --locked

      - if: steps.version.outputs.release == 'true'
        name: Assemble release artifacts
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          DEB: ${{ matrix.deb }}
        run: |
          mkdir dist
          if [[ "$DEB" == "true" ]]; then
            cp target/debian/*.deb "dist/logcrab_${ARCH}_${PLATFORM}.deb"
          else
            tar -C target/release -czf "dist/logcrab_${ARCH}_${PLATFORM}.tar.gz" logcrab
          fi

      - if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - id: version
        name: Detect package version change
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          current="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "logcrab").version')"
          tag="v${current}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            previous="$(git show "$BEFORE:Cargo.toml" 2>/dev/null | awk -F'"' '/^version = / { print $2; exit }')"
            if [[ "$current" == "$previous" ]]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          commit="$(git rev-parse HEAD)"
          remote_tag_commit="$(git ls-remote origin "refs/tags/${tag}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_tag_commit" ]]; then
            remote_tag_commit="$(git ls-remote origin "refs/tags/${tag}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -n "$remote_tag_commit" && "$remote_tag_commit" != "$commit" ]]; then
            echo "::error::Release tag ${tag} points to ${remote_tag_commit}, not ${commit}"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - if: steps.version.outputs.release == 'true'
        name: Add source package recipe
        run: cp PKGBUILD dist/

      - if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.commit }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  homebrew:
    name: Update Homebrew tap
    needs: publish
    if: needs.publish.outputs.release == 'true'
    runs-on: ubuntu-24.04

    concurrency:
      group: homebrew-tap
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3993457ccf477a3b029a1a1a63d3f7a24ffaac17 # Trusted formula generator revision
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: daniel-freiermuth/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false

      - name: Generate formula
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          version="${TAG#v}"
          base_url="https://github.com/daniel-freiermuth/logcrab/releases/download/${TAG}"
          curl --fail --location --output arm.tar.gz "${base_url}/logcrab_aarch64_macos.tar.gz"
          curl --fail --location --output intel.tar.gz "${base_url}/logcrab_x86_64_macos.tar.gz"
          python3 source/scripts/write_homebrew_formula.py \
            --output tap/Formula/logcrab.rb \
            --version "$version" \
            --arm-sha256 "$(sha256sum arm.tar.gz | cut -d ' ' -f 1)" \
            --intel-sha256 "$(sha256sum intel.tar.gz | cut -d ' ' -f 1)"

      - name: Commit formula update
        working-directory: tap
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git add Formula/logcrab.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "logcrab ${TAG#v}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 --wrap=0)" push
